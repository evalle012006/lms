services:
  hasura:
    image: hasura/graphql-engine:v2.37.0
    volumes:
      - ./hasura/metadata:/hasura-metadata
      - ./hasura/migrations:/hasura-migrations
    expose:
      - "${HASURA_PORT:-8080}"
    ports:
      - "${HASURA_PORT:-8080}:${HASURA_PORT:-8080}"
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@host.docker.internal:5433/${POSTGRES_DB:-acloandb}
      # CRITICAL: These MUST be false in production - no defaults
      HASURA_GRAPHQL_ENABLE_CONSOLE: "${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}"
      HASURA_GRAPHQL_DEV_MODE: "${HASURA_GRAPHQL_DEV_MODE:-false}"
      HASURA_GRAPHQL_ENABLE_INTROSPECTION: "${HASURA_GRAPHQL_ENABLE_INTROSPECTION:-false}"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      # CRITICAL: No default - must be set in .env
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - |
        if [ "$HASURA_ADMIN_SECRET" = "lms_01" ] || [ -z "$HASURA_ADMIN_SECRET" ]; then
          echo "CRITICAL SECURITY ERROR: HASURA_ADMIN_SECRET not set or using default!"
          echo "Set a strong HASURA_ADMIN_SECRET in your .env file"
          exit 1
        fi
        graphql-engine serve